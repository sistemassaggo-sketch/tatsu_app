name: Database Backup to Google Drive

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 3:00 AM Bogotá, 
    # tomando en cuenta que el servidor de github actions corre en UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    environment: Production

    # 1. Define el secreto a nivel de JOB para que no falle el alcance
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL 18
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Install Rclone
        run: |
          sudo curl https://rclone.org/install.sh | sudo bash

      - name: Configurar Rclone desde Base64
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" | base64 --decode > ~/.config/rclone/rclone.conf

      - name: Run pg_dump & Upload to Google Drive
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |

          # 2. Validación de seguridad para ver si llegó vacío
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error:: La variable NEON_DATABASE_URL está vacía. Revisa tus GitHub Secrets."
            exit 1
          fi
          
          TIMESTAMP=$(date +"%Y-%m-%d")
          BACKUP_FILE="db_backup_$TIMESTAMP.sql"
          
          echo "Generando respaldo desde Neon..."
          /usr/lib/postgresql/18/bin/pg_dump "$NEON_DATABASE_URL" -f "$BACKUP_FILE"
          
          echo "Subiendo a Google Drive..."
          rclone copy "$BACKUP_FILE" "gdrive:DatabaseBackups"
          
          echo "¡Respaldo completado con éxito en Google Drive!"
